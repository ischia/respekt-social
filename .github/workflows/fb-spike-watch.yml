name: FB Comment Spike Watch

on:
  schedule:
    # Každou hodinu. Měří se přírůstek za 4 hodiny, takže čím hustší
    # vzorkování, tím přesnější základna a tím dřív se spike ozve.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # umožní ruční spuštění z GitHub UI

permissions:
  contents: write  # potřeba pro commit aktualizovaného stavu zpátky do repa

jobs:
  spike-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repa
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spustit sledování spiků
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/fb_comment_spike_watch.py

      - name: Commitnout aktualizovaný stav
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "fb-spike-watch: update state [skip ci]"
          git push
