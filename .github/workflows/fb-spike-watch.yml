name: FB Comment Spike Watch

on:
  schedule:
    # Dvakrát za hodinu a záměrně mimo celou hodinu: GitHub scheduled
    # workflows se pod zátěží opožďují i o hodiny a běhy tiše zahazuje,
    # nejvíc právě v minutě 0, kdy se spouští půlka světa. Reálné rozestupy
    # tak vycházely 2-4 hodiny místo jedné, což při dvouhodinovém okně
    # detekci rozbíjí. Víc pokusů = víc skutečně proběhlých běhů.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}  # umožní ruční spuštění z GitHub UI

permissions:
  contents: write  # potřeba pro commit aktualizovaného stavu zpátky do repa

jobs:
  spike-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repa
        uses: actions/checkout@v5

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Spustit sledování spiků
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Kanály pro upozornění — stačí jeden, dá se jich zapnout víc.
          # Nenastavený secret = kanál vypnutý.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Ladicí parametry — po týdnu provozu je vhodné je upravit
          # podle toho, kolik notifikací reálně chodí.
          WINDOW_HOURS: "2"       # v jak dlouhém okně se přírůstek měří
          DELTA_THRESHOLD: "25"   # kolik komentářů v okně přibude = spike
          COMMENT_FILTER: "stream"      # počítat i odpovědi ve vláknech
          QUIET_HOURS: "22-7"     # noční klid (prázdné = vypnuto)
          TIMEZONE: "Europe/Prague"
          NIGHT_ESCALATION_FACTOR: "3"  # 3× práh probudí i v noci (0 = nikdy)
        run: python scripts/fb_comment_spike_watch.py

      - name: Commitnout aktualizovaný stav
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "fb-spike-watch: update state [skip ci]"
          git push
